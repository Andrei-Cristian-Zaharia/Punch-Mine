# TEMPORARY (branch director-mode only, deleted before merging): checks the
# Release build has no Director code, that a seed reproduces its PLAN, and
# records a few clips with the same steps as record-scenarios.yml.
# Records Director mode scenarios (Debug build, iOS Simulator) as MP4 clips
# for Asar Studio (see README.md, "Director mode").
# Manual trigger only: the repo is public, so nothing runs on push or on PRs
# from forks. No secrets are used.
name: Director dev check (temporary)

on:
  push:
    branches: [director-mode]

permissions:
  contents: read

concurrency:
  group: director-dev
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Build (Release, iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build -project "Punch Mine.xcodeproj" -scheme "Punch Mine" -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/DD \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - name: No Director code in Release
        run: |
          set -euo pipefail
          bin="build/DD/Build/Products/Release-iphonesimulator/Punch Mine.app/Punch Mine"
          test -f "$bin"
          found=0
          if strings -a "$bin" | grep -E '\[Director\]|scenarioSeed|scenarioCapture|DirectorCapture'; then found=1; fi
          # Real symbols only (not the debug map, which names the empty source files); not "Directory".
          if nm "$bin" | grep -E 'Director([^y]|$)'; then found=1; fi
          if [ "$found" -ne 0 ]; then echo "::error::Director code found in the Release binary"; exit 1; fi
          echo "Release binary has no Director strings or symbols."

  record:
    runs-on: macos-latest
    # Offline 60 fps capture runs slower than real time on the runner.
    timeout-minutes: 150
    env:
      PROJECT: Punch Mine.xcodeproj
      SCHEME: Punch Mine
      BUNDLE_ID: com.andreizaharia.punchmine
      DERIVED_DATA: build/DerivedData
      SOURCE_PACKAGES: build/SourcePackages
      # Asar Studio reads the next two lines from this file (scenario list and
      # default lengths); keep them on one line each, in this form.
      ALL_SCENARIOS: heartFight,areaBlitz,crystalChain,highTide,magmaVents,weeklyHeart,quarryMining,cavernsMining,magmaMining,ruinsMining,cryptMining
      # Per-scenario clip length in seconds, used when the `duration` input
      # does not set one. heartFight needs the kill (23-29 s) plus the crown
      # card; weeklyHeart is the 30 s fight plus "TIME!".
      DEFAULT_DURATIONS: heartFight=38,areaBlitz=35,crystalChain=30,highTide=35,magmaVents=30,weeklyHeart=32,quarryMining=30,cavernsMining=30,magmaMining=30,ruinsMining=30,cryptMining=30
      MIN_DURATION: "5"
      MAX_DURATION: "120"
      MAX_COUNT: "12"
      # A clip whose scenario+parameters repeat an earlier clip of the run is
      # re-rolled with a new seed, at most this many times, then skipped.
      MAX_REROLLS: "6"
      # Static-clip rejection (see the validate step): most of a clip frozen,
      # a scene that changes only in a tiny area, or almost no unique frames.
      MAX_FROZEN_PCT: "30"
      MIN_CHANGED_AREA_PCT: "1.0"
      MIN_UNIQUE_PCT: "25"
      # Output frame rate, and the real one: unique frames per second
      # (mpdecimate on the gameplay area, from the first gameplay frame)
      # must average at least this much, or the clip fails.
      FPS: "60"
      # Every scenario keeps something moving each frame (damage numbers rise
      # for 0.85 s, debris, glows, waves), so no scenario lowers it.
      MIN_UNIQUE_FPS: "55"
      # Give up on a capture that runs more than this many times slower
      # than real time.
      CAPTURE_SLOWDOWN_MAX: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          IN_SCENARIO: all
          IN_COUNT: 11
          IN_SEED: 2000
          IN_DURATION: 
        run: |
          set -euo pipefail
          scenarios="$(echo "${IN_SCENARIO:-random}" | tr -d '[:space:]')"
          if [ -z "$scenarios" ]; then scenarios=random; fi
          if [ "$scenarios" = "all" ]; then scenarios="$ALL_SCENARIOS"; fi
          for s in ${scenarios//,/ }; do
            case ",$ALL_SCENARIOS,random," in
              *",$s,"*) ;;
              *) echo "::error::Unknown scenario '$s' (allowed: random, all, $ALL_SCENARIOS)"; exit 1 ;;
            esac
          done
          count="$(echo "${IN_COUNT:-5}" | tr -d '[:space:]')"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ] || [ "$count" -gt "$MAX_COUNT" ]; then
            echo "::error::count must be a whole number between 1 and $MAX_COUNT (got '$count')"; exit 1
          fi
          seed="$(echo "${IN_SEED:-}" | tr -d '[:space:]')"
          if [ -z "$seed" ]; then
            # New every run: clock, run id and attempt mixed, kept to 9 digits.
            seed=$(( ( ($(date +%s) * 32768 + RANDOM) ^ (GITHUB_RUN_ID * 2654435761) ^ GITHUB_RUN_ATTEMPT ) % 1000000000 ))
            seed=${seed#-}
          elif ! [[ "$seed" =~ ^[0-9]{1,15}$ ]]; then
            echo "::error::seed must be a whole number of up to 15 digits (got '$seed')"; exit 1
          fi
          seed=$((10#$seed))
          echo "::notice title=Recording seed::seed=$seed (re-run with this seed, the same scenario input and count to reproduce)"
          echo "Base seed: $seed"
          # The clip plan: one scenario request per clip, cycling the list.
          read -r -a list <<<"${scenarios//,/ }"
          : > "$RUNNER_TEMP/requests.txt"
          for ((i = 0; i < count; i++)); do echo "${list[i % ${#list[@]}]}" >> "$RUNNER_TEMP/requests.txt"; done
          {
            echo "**Seed:** \`$seed\` · **Clips:** $count · **Scenario:** \`$scenarios\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # One file per scenario holding its clip length in seconds:
          # defaults first, then the input (a number for all, or s=n pairs).
          dir="$RUNNER_TEMP/durations"
          mkdir -p "$dir"
          set_duration() {
            local s="$1" d="$2"
            case ",$ALL_SCENARIOS," in
              *",$s,"*) ;;
              *) echo "::error::Unknown scenario '$s' in duration (allowed: $ALL_SCENARIOS)"; exit 1 ;;
            esac
            if ! [[ "$d" =~ ^[0-9]+$ ]] || [ "$d" -lt "$MIN_DURATION" ] || [ "$d" -gt "$MAX_DURATION" ]; then
              echo "::error::Duration for $s must be a whole number of seconds between $MIN_DURATION and $MAX_DURATION (got '$d')"; exit 1
            fi
            echo "$d" > "$dir/$s"
          }
          for kv in ${DEFAULT_DURATIONS//,/ }; do set_duration "${kv%%=*}" "${kv#*=}"; done
          duration="$(echo "${IN_DURATION:-}" | tr -d '[:space:]')"
          if [ -n "$duration" ] && [ "$duration" != "default" ]; then
            if [[ "$duration" =~ ^[0-9]+$ ]]; then
              for s in ${ALL_SCENARIOS//,/ }; do set_duration "$s" "$duration"; done
            else
              for kv in ${duration//,/ }; do
                [[ "$kv" == *=* ]] || { echo "::error::duration '$kv' is not a number or scenario=seconds"; exit 1; }
                set_duration "${kv%%=*}" "${kv#*=}"
              done
            fi
          fi
          echo "| Scenario | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for s in ${ALL_SCENARIOS//,/ }; do
            echo "$s: $(cat "$dir/$s") s"
            echo "| $s | $(cat "$dir/$s") |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "SEED=$seed" >> "$GITHUB_ENV"
          echo "REQUESTS=$RUNNER_TEMP/requests.txt" >> "$GITHUB_ENV"
          # Written by the record step: id, scenario, seed, seconds per clip.
          echo "CLIPS_TSV=$RUNNER_TEMP/clips.tsv" >> "$GITHUB_ENV"
          echo "DURATIONS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Select newest Xcode
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick and boot an iPhone simulator
        run: |
          set -euo pipefail
          # Newest iOS runtime, smallest iPhone on it. An iPhone SE is 750x1334
          # (exactly 9:16), so the runner keeps up with recording and the clip
          # scales cleanly to 1080x1920. A 3x Pro (1206x2622) made simctl drop
          # frames and write variable-rate, partly corrupt MP4s. If the runtime
          # supports an SE but none exists, one is created.
          pick="$(xcrun simctl list -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = data["devices"]
          small = ["iPhone SE (3rd generation)", "iPhone SE (2nd generation)"]
          runtimes = [r for r in data["runtimes"]
                      if r.get("platform", "iOS") == "iOS" and r.get("isAvailable", True)]
          runtimes.sort(key=lambda r: [int(n) for n in r["version"].split(".") if n.isdigit()], reverse=True)
          for rt in runtimes:
              phones = [d for d in devices.get(rt["identifier"], [])
                        if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              for name in small:
                  for d in phones:
                      if d["name"] == name:
                          print("use", d["udid"]); sys.exit()
              for name in small:
                  for t in rt.get("supportedDeviceTypes", []):
                      if t["name"] == name:
                          print("create", t["identifier"], rt["identifier"]); sys.exit()
              # No SE on this runtime: avoid the heavier Pro/Plus/Max screens.
              plain = [d for d in phones if not any(w in d["name"] for w in ("Pro", "Plus", "Max", "Air"))]
              if plain or phones:
                  print("use", (plain or phones)[0]["udid"]); sys.exit()
          ')"
          read -r action a b <<<"$pick" || true
          case "${action:-}" in
            use) udid="$a" ;;
            create) udid="$(xcrun simctl create "Recorder iPhone" "$a" "$b")" ;;
            *) echo "::error::No iPhone simulator available"; exit 1 ;;
          esac
          xcrun simctl list devices | grep "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # Boot now so it comes up while the app builds.
          xcrun simctl boot "$udid"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Punch Mine/**', 'Punch Mine.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Build (Debug, iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Install app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$UDID" -b
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          test -d "$app"
          xcrun simctl install "$UDID" "$app"
          # Clean status bar: it is in every frame of the capture.
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Determinism (same seed = same PLAN, other seeds = other keys)
        run: |
          set -euo pipefail
          plan() {
            local log="$RUNNER_TEMP/plan-$1-$2.log"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            : > "$log"
            xcrun simctl launch --stderr="$log" "$UDID" "$BUNDLE_ID" -scenario "$1" -scenarioSeed "$2" -scenarioDuration 4 </dev/null >/dev/null
            for _ in $(seq 1 300); do grep -q '\[Director\] PLAN ' "$log" && break; sleep 0.1; done
            sleep 3
            grep -m1 '\[Director\] PLAN ' "$log" | sed 's/^.*\[Director\] PLAN //'
          }
          for s in quarryMining heartFight weeklyHeart crystalChain random; do
            a="$(plan "$s" 4242)"
            echo "--- $s (real time, 4 s) ---"
            grep '\[Director\]' "$RUNNER_TEMP/plan-$s-4242.log" | head -12 || true
            b="$(plan "$s" 4242)"
            if [ -z "$a" ] || [ "$a" != "$b" ]; then echo "::error::$s: the same seed gave different PLANs"; echo "$a"; echo "$b"; exit 1; fi
            echo "$s seed 4242: identical PLAN"
          done
          : > "$RUNNER_TEMP/keys.txt"
          for seed in 11 12 13 14 15 16; do
            k="$(plan quarryMining "$seed" | python3 -c 'import json, sys; print(json.load(sys.stdin)["key"])')"
            echo "quarryMining seed $seed: $k"
            echo "$k" >> "$RUNNER_TEMP/keys.txt"
          done
          n="$(sort -u "$RUNNER_TEMP/keys.txt" | grep -c .)"
          if [ "$n" -lt 5 ]; then echo "::error::only $n different keys from 6 seeds"; exit 1; fi
          echo "6 seeds gave $n different keys"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true

      - name: Record scenarios
        run: |
          set -euo pipefail
          # No `simctl io recordVideo`: a screen recording of this GPU-less
          # simulator only got the ~30 frames per second it could draw in
          # real time. The app records offline at exactly 60 fps instead
          # (Punch Mine/Director/DirectorCapture.swift) and the clip is copied
          # out of its data container.
          mkdir -p raw plans
          : > "$CLIPS_TSV"
          keys="$RUNNER_TEMP/keys.txt"
          : > "$keys"
          # A `random` request learns its type only from the app's PLAN line,
          # so its autopilot runs for the longest clip length.
          maxdur=0
          for f in "$DURATIONS_DIR"/*; do
            d="$(cat "$f")"
            if [ "$d" -gt "$maxdur" ]; then maxdur="$d"; fi
          done
          i=0
          # fd 3: simctl and python must not eat the request list on stdin.
          while read -r req <&3; do
            [ -n "$req" ] || continue
            # Launch with a seed and read the moment Director mode rolled
            # (`[Director] PLAN {json}`). If its scenario+parameters repeat an
            # earlier clip of this run, re-roll with another seed before
            # recording anything.
            # Capture starts when the app appears, on the same virtual clock
            # as the autopilot; the autopilot runs well past the clip, so the
            # clip never catches it winding down.
            # Director mode logs to stderr (a status line every second: area,
            # pacing, punch power, autopilot move; area clears, beats and
            # warnings); it is printed below so it shows in the Actions log.
            clip_seed=""
            plan=""
            for ((attempt = 0; attempt <= MAX_REROLLS; attempt++)); do
              cs=$(( SEED + i + attempt * 1000 ))
              if [ "$req" = random ]; then launchdur="$maxdur"; else launchdur="$(cat "$DURATIONS_DIR/$req")"; fi
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              applog="$PWD/raw/clip$i.director.log"
              : > "$applog"
              xcrun simctl launch --stderr="$applog" "$UDID" "$BUNDLE_ID" \
                -scenario "$req" -scenarioSeed "$cs" -scenarioDuration "$((launchdur + 12))" \
                -scenarioCapture "$((launchdur + 1))" -AppleLanguages "(en)" -AppleLocale en_US </dev/null
              for _ in $(seq 1 200); do
                grep -q '\[Director\] PLAN ' "$applog" && break
                sleep 0.1
              done
              line="$(grep -m1 '\[Director\] PLAN ' "$applog" | sed 's/^.*\[Director\] PLAN //' || true)"
              if [ -z "$line" ]; then
                cat "$applog"; echo "::error::clip $i ($req, seed $cs): Director mode printed no PLAN line"; exit 1
              fi
              IFS=$'\t' read -r s key <<<"$(python3 -c 'import json, sys; d = json.loads(sys.argv[1]); print(d["scenario"] + "\t" + d["key"])' "$line")"
              if grep -Fxq "$key" "$keys"; then
                echo "clip $i: seed $cs repeats an earlier clip ($key), re-rolling"
                xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
                continue
              fi
              clip_seed="$cs"
              plan="$line"
              break
            done
            if [ -z "$clip_seed" ]; then
              echo "::warning::clip $i ($req): every re-roll repeated an earlier clip, skipped"
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              i=$((i + 1))
              continue
            fi
            echo "$key" >> "$keys"
            id="${s}_seed${clip_seed}"
            duration="$(cat "$DURATIONS_DIR/$s")"
            echo "$plan" > "plans/$id.json"
            # Same file, new name; the app keeps writing into it.
            mv "$applog" "raw/$id.director.log"
            applog="$PWD/raw/$id.director.log"
            echo "::group::$id (${duration}s) $key"
            echo "Plan: $plan"
            s="$id"
            # The app captures the clip itself (-scenarioCapture): it steps
            # the game by exactly 1/60 s per frame and grabs each frame after
            # it is drawn, so the runner's speed only changes how long this
            # takes, not the clip. Wait for its CAPTURE done/failed line.
            limit=$(( (launchdur + 1) * CAPTURE_SLOWDOWN_MAX + 120 ))
            done_line=""
            started=$SECONDS
            while [ $((SECONDS - started)) -lt "$limit" ]; do
              done_line="$(grep -m1 -E '\[Director\] CAPTURE (done|failed)' "$applog" || true)"
              [ -n "$done_line" ] && break
              sleep 2
            done
            grep '\[Director\] CAPTURE' "$applog" || true
            if [ -z "$done_line" ]; then
              tail -50 "$applog"
              echo "::error::$s: the in-app 60 fps capture did not finish within ${limit}s (see the CAPTURE progress lines above)"; exit 1
            fi
            if [[ "$done_line" == *"CAPTURE failed"* ]]; then
              tail -50 "$applog"
              echo "::error::$s: ${done_line#*\[Director\] }"; exit 1
            fi
            run_from="$(sed -n 's/.*runFrom=\([0-9][0-9]*\).*/\1/p' <<<"$done_line")"
            stale="$(sed -n 's/.*staleFrames=\([0-9][0-9]*\).*/\1/p' <<<"$done_line")"
            if [ "${stale:-0}" -gt 0 ]; then
              echo "::warning title=Capture $s::${stale} frames were captured before the screen confirmed the new frame"
            fi
            container="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
            cp "$container/Documents/DirectorCapture/capture.mp4" "raw/$s.mp4"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            echo "--- Director log ($s) ---"
            grep '\[Director\]' "$applog" || echo "(no Director output)"
            if grep -q 'WARNING' "$applog"; then
              echo "::warning title=Director $s::$(grep -m1 'WARNING' "$applog" | sed 's/^.*\[Director\] //')"
            fi
            test -s "raw/$s.mp4"
            ls -lh "raw/$s.mp4"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,avg_frame_rate,r_frame_rate:format=duration \
              -of default=noprint_wrappers=1 "raw/$s.mp4"
            echo "::endgroup::"
            # 5th column: first frame showing gameplay (-1 = never).
            printf '%s\t%s\t%s\t%s\t%s\n' "$id" "${id%_seed*}" "$clip_seed" "$duration" "${run_from:--1}" >> "$CLIPS_TSV"
            i=$((i + 1))
          done 3< "$REQUESTS"
          if ! [ -s "$CLIPS_TSV" ]; then echo "::error::No clips were recorded"; exit 1; fi
          echo "Recorded clips (base seed $SEED):"
          cat "$CLIPS_TSV"

      - name: Encode clips (60 fps CFR, 1080x1920, yuv420p, faststart)
        run: |
          set -euo pipefail
          mkdir -p clips
          # Raw clips only: no text, captions or audio. Titles and voiceover
          # are added later in Asar Studio. The capture is already exactly
          # 60 fps (one frame per 1/60 s game step), so `fps` changes nothing
          # but guarantees CFR timestamps.
          vf="fps=$FPS,scale=1080:1920:force_original_aspect_ratio=decrease:flags=lanczos"
          vf="$vf,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,format=yuv420p"
          while IFS=$'\t' read -r s _ _ duration _ <&3; do
            echo "::group::$s (${duration}s)"
            ffmpeg -hide_banner -v error -y -i "raw/$s.mp4" \
              -t "$duration" -vf "$vf" -fps_mode cfr -r "$FPS" \
              -c:v libx264 -preset medium -crf 18 -profile:v high -pix_fmt yuv420p \
              -g "$((FPS * 2))" -an -sn -dn -map_metadata -1 -movflags +faststart \
              "clips/$s.mp4"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate,r_frame_rate,nb_frames:format=duration \
              -of default=noprint_wrappers=1 "clips/$s.mp4"
            echo "::endgroup::"
          done 3< "$CLIPS_TSV"

      - name: Validate clips (decode, 60 fps CFR, real 60 fps, vertical, duration, not static)
        id: validate
        run: |
          set -euo pipefail
          # Every requested scenario must have a clip that decodes with zero
          # errors, is h264 yuv420p 1080x1920 at a constant 60 fps (every
          # frame exactly 1/60 s apart) with at least MIN_UNIQUE_FPS unique
          # frames per second in the gameplay area (real fps, not duplicates), has no audio/subtitle/data streams,
          # and lasts within +/-1 s of the requested duration. The summary
          # goes to the job page and to the `clip-validation` artifact; the
          # job fails if any clip does not pass.
          mkdir -p validation
          checker="$RUNNER_TEMP/check_clip.py"
          cat > "$checker" <<'PY'
          import json, subprocess, sys
          from fractions import Fraction

          import os
          scenario, clip, requested, decode_errors = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          run_from = int(sys.argv[5]) if len(sys.argv) > 5 else 0   # first world frame, -1 = none
          FPS, WIDTH, HEIGHT, TOLERANCE = int(os.environ.get("FPS", "60")), 1080, 1920, 1.0
          problems = []
          if decode_errors:
              problems.append(f"{decode_errors} decode errors")

          def probe(*args):
              out = subprocess.run(["ffprobe", "-v", "error", "-of", "json", *args, clip],
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out)

          def frac(x):
              try:
                  return Fraction(x)
              except (TypeError, ValueError, ZeroDivisionError):
                  return Fraction(0)

          size = rates = step = duration = "-"
          pts = []
          try:
              info = probe("-show_entries",
                           "stream=codec_type,codec_name,pix_fmt,width,height,r_frame_rate,avg_frame_rate,time_base"
                           ":format=duration")
              streams = info.get("streams", [])
              video = [st for st in streams if st.get("codec_type") == "video"]
              others = sorted({st.get("codec_type", "?") for st in streams if st.get("codec_type") != "video"})
              if others:
                  problems.append("unexpected streams: " + ", ".join(others))
              if len(video) != 1:
                  problems.append(f"{len(video)} video streams")
              if video:
                  v = video[0]
                  w, h = int(v.get("width", 0)), int(v.get("height", 0))
                  size = f"{w}x{h}"
                  if (w, h) != (WIDTH, HEIGHT):
                      problems.append(f"size {size}, expected {WIDTH}x{HEIGHT} (vertical)")
                  if v.get("codec_name") != "h264":
                      problems.append(f"codec {v.get('codec_name')}, expected h264")
                  if v.get("pix_fmt") != "yuv420p":
                      problems.append(f"pix_fmt {v.get('pix_fmt')}, expected yuv420p")
                  r, avg = frac(v.get("r_frame_rate")), frac(v.get("avg_frame_rate"))
                  rates = f"{float(r):.3f} / {float(avg):.3f}"
                  if r != FPS or abs(float(avg) - FPS) > 0.05:
                      problems.append(f"frame rate {rates}, expected {FPS}")
                  # Constant frame rate: sorted presentation timestamps must
                  # all be one frame apart (1 tick of slack for rounding).
                  tb = frac(v.get("time_base"))
                  pts = sorted(int(p["pts"]) for p in
                               probe("-select_streams", "v:0", "-show_entries", "packet=pts").get("packets", [])
                               if str(p.get("pts", "")).lstrip("-").isdigit())
                  diffs = [b - a for a, b in zip(pts, pts[1:])]
                  if tb <= 0 or not diffs:
                      problems.append("no frame timestamps")
                  else:
                      expected = 1 / (tb * FPS)
                      lo, hi = min(diffs), max(diffs)
                      step = f"{float(lo * tb * 1000):.2f}-{float(hi * tb * 1000):.2f} ms"
                      if lo < expected - 1 or hi > expected + 1:
                          problems.append(f"variable frame spacing {step}, expected {float(1000 / FPS):.2f} ms")
              d = float(info.get("format", {}).get("duration", "nan"))
              duration = f"{d:.2f}s"
              if not abs(d - requested) <= TOLERANCE:
                  problems.append(f"duration {duration}, expected {requested}s +/- {TOLERANCE:g}s")
          except (subprocess.CalledProcessError, ValueError, KeyError) as e:
              problems.append(f"ffprobe failed: {e}")

          # Static-clip check. A recording where the mine stopped
          # redrawing still changes a little (HUD text, timers),
          # so the decode/format checks above pass; these do not.
          #  - freezedetect (noise 0.003, >= 2 s): share of the clip frozen.
          #  - changed area: per frame, % of pixels whose luma moved by more
          #    than 10 vs the previous frame; the largest value in each
          #    second, then the median of those (duplicate frames from a
          #    slow simulator do not drag it down).
          #  - mpdecimate: share of frames that differ from the last kept one.
          import os, re, statistics
          MAX_FROZEN = float(os.environ.get("MAX_FROZEN_PCT", "30"))
          MIN_AREA = float(os.environ.get("MIN_CHANGED_AREA_PCT", "1.0"))
          MIN_UNIQUE = float(os.environ.get("MIN_UNIQUE_PCT", "25"))
          MIN_UNIQUE_FPS = float(os.environ.get("MIN_UNIQUE_FPS", "55"))
          frozen_txt = area_txt = unique_txt = real_txt = "-"

          def ffmpeg_filter(vf, level="info", fmt="null"):
              run = subprocess.run(["ffmpeg", "-hide_banner", "-nostdin", "-v", level, "-i", clip,
                                    "-map", "0:v:0", "-vf", vf, "-fps_mode", "passthrough", "-f", fmt, "-"],
                                   capture_output=True, text=True)
              return run.stdout, run.stderr

          try:
              clip_len = float(duration.rstrip("s")) if duration != "-" else float(requested)
              _, err = ffmpeg_filter("freezedetect=n=0.003:d=2")
              frozen, start = 0.0, None
              for m in re.finditer(r"freeze_(start|end): ([0-9.]+)", err):
                  if m.group(1) == "start":
                      start = float(m.group(2))
                  elif start is not None:
                      frozen += float(m.group(2)) - start
                      print(f"{scenario}: frozen {start:.2f}-{float(m.group(2)):.2f}s", file=sys.stderr)
                      start = None
              if start is not None:                      # still frozen at the end
                  frozen += max(0.0, clip_len - start)
                  print(f"{scenario}: frozen {start:.2f}s-end", file=sys.stderr)
              frozen_pct = 100 * frozen / clip_len if clip_len > 0 else 100
              frozen_txt = f"{frozen_pct:.1f}%"
              if frozen_pct > MAX_FROZEN:
                  problems.append(f"static clip: {frozen_txt} frozen (freezedetect n=0.003 d=2), max {MAX_FROZEN:g}%")

              _, err = ffmpeg_filter("format=gray,tblend=all_mode=difference,blackframe=amount=0:threshold=10")
              per_second = {}
              for m in re.finditer(r"pblack:(\d+)\S*\s.*?\bt:([0-9.]+)", err):
                  sec = int(float(m.group(2)))
                  per_second[sec] = max(per_second.get(sec, 0.0), 100.0 - float(m.group(1)))
              if per_second:
                  area = statistics.median(per_second.values())
                  area_txt = f"{area:.2f}%"
                  if area < MIN_AREA:
                      problems.append(f"scene changes only in a tiny area: median {area_txt} of pixels per second, min {MIN_AREA:g}%")
              else:
                  problems.append("changed-area analysis produced no data")

              out, _ = ffmpeg_filter("mpdecimate", level="error", fmt="framemd5")
              kept = sum(1 for line in out.splitlines() if line and not line.startswith("#"))
              total = len(pts) or kept
              unique = 100 * kept / total if total else 0
              unique_txt = f"{unique:.0f}% ({kept}/{total})"
              if unique < MIN_UNIQUE:
                  problems.append(f"only {unique_txt} unique frames (mpdecimate), min {MIN_UNIQUE:g}%")

              # Real frame rate: unique frames per second in the gameplay area
              # (middle 60% of the height: the block grid or the Weekly Heart; the top
              # bar and the minimized drawer do not count), from the first gameplay
              # frame. mpdecimate is
              # tighter than its defaults so small but real motion counts,
              # while re-encoded duplicates (near-zero difference) still drop.
              if run_from < 0:
                  problems.append("gameplay never appeared in the capture")
              else:
                  start = run_from / FPS
                  out, _ = ffmpeg_filter("crop=iw:ih*0.6:0:ih*0.2,mpdecimate=hi=256:lo=128:frac=0.1",
                                         level="error", fmt="framemd5")
                  # framemd5 lines: stream, dts, pts, duration, size, md5;
                  # timestamps are in the `#tb 0: n/d` of its own header.
                  stamps, out_tb = [], Fraction(0)
                  for line in out.splitlines():
                      m = re.match(r"#tb 0:\s*(\d+)/(\d+)", line)
                      if m:
                          out_tb = Fraction(int(m.group(1)), int(m.group(2)))
                      elif line and not line.startswith("#"):
                          f = [x.strip() for x in line.split(",")]
                          if len(f) >= 4 and f[2].lstrip("-").isdigit():
                              stamps.append(int(f[2]))
                  times = [float(p * out_tb) for p in stamps] if out_tb > 0 else []
                  span = clip_len - start
                  world_kept = sum(1 for t in times if t >= start - 1e-6)
                  real_fps = world_kept / span if span > 0 else 0
                  real_txt = f"{real_fps:.1f}"
                  print(f"{scenario}: declared {rates} fps, real {real_fps:.1f} unique fps in the gameplay area "
                        f"({world_kept} unique frames over {span:.2f}s from {start:.2f}s)", file=sys.stderr)
                  if not times:
                      problems.append("unique-frame analysis produced no data")
                  elif real_fps < MIN_UNIQUE_FPS:
                      problems.append(f"only {real_fps:.1f} unique frames per second in the gameplay area "
                                      f"(mpdecimate, from {start:.2f}s), need at least {MIN_UNIQUE_FPS:g}: "
                                      f"the {FPS} fps clip is padded with duplicate frames")
          except (OSError, ValueError) as e:
              problems.append(f"motion analysis failed: {e}")

          result = "PASS" if not problems else "FAIL: " + "; ".join(problems)
          print(f"| {scenario} | {decode_errors} | {size} | {rates} | {step} | {duration} ({requested}s) "
                f"| {frozen_txt} | {area_txt} | {unique_txt} | {real_txt} | {result} |")
          for p in problems:
              print(f"::error title=Clip {scenario} failed validation::{p}", file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY
          summary=validation/summary.md
          {
            echo "## Clip validation"
            echo
            echo "Base seed: \`$SEED\`"
            echo
            echo "| Clip | Decode errors | Size | FPS (r / avg) | Frame spacing | Duration (requested) | Frozen | Changed area | Unique frames | Real fps (world) | Result |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } > "$summary"
          failed=0
          results="$RUNNER_TEMP/results.tsv"
          : > "$results"
          while IFS=$'\t' read -r s _ _ requested run_from <&3; do
            clip="clips/$s.mp4"
            if [ ! -s "$clip" ]; then
              echo "::error title=Clip $s failed validation::missing clip"
              echo "| $s | - | - | - | - | - (${requested}s) | - | - | - | - | FAIL: missing clip |" >> "$summary"
              printf '%s\t%s\n' "$s" "FAIL: missing clip" >> "$results"
              failed=1
              continue
            fi
            # Full decode of the video stream; every line ffmpeg prints at
            # level `error` counts, and so does a non-zero exit.
            errlog="validation/$s.decode.log"
            ffmpeg -hide_banner -nostdin -v error -i "$clip" -map 0:v:0 -f null - 2>"$errlog" \
              || echo "ffmpeg exited with status $?" >> "$errlog"
            errors="$(grep -c . "$errlog" || true)"
            if [ "$errors" -gt 0 ]; then head -20 "$errlog"; fi
            row="$(python3 "$checker" "$s" "$clip" "$requested" "$errors" "${run_from:-0}")" || failed=1
            echo "$row" >> "$summary"
            printf '%s\t%s\n' "$s" "$(echo "$row" | awk -F' [|] ' '{print $(NF)}' | sed 's/ *|$//')" >> "$results"
          done 3< "$CLIPS_TSV"
          {
            echo
            if [ "$failed" -eq 0 ]; then echo "All clips passed."; else echo "**Some clips failed validation.**"; fi
          } >> "$summary"
          # Manifest next to the videos: seed, scenario, parameters, movement
          # pattern and validation result per clip (from each PLAN line).
          python3 - "$CLIPS_TSV" "$results" "$SEED" plans clips/manifest.json <<'PY'
          import json, os, sys
          tsv, results_path, base, plans, out = sys.argv[1:6]
          results = {}
          for line in open(results_path):
              if "\t" in line:
                  cid, res = line.rstrip("\n").split("\t", 1)
                  results[cid] = res
          clips = []
          for line in open(tsv):
              parts = line.rstrip("\n").split("\t")
              if len(parts) < 4:
                  continue
              cid, scenario, seed, seconds = parts[:4]
              plan = {}
              path = os.path.join(plans, cid + ".json")
              if os.path.exists(path):
                  try:
                      plan = json.load(open(path))
                  except ValueError:
                      plan = {}
              clips.append({
                  "file": cid + ".mp4",
                  "scenario": scenario,
                  "seed": int(seed),
                  "durationSeconds": int(seconds),
                  "key": plan.get("key"),
                  "requested": plan.get("requested"),
                  "parameters": plan.get("params", {}),
                  "movement": plan.get("movement", {}),
                  "validation": results.get(cid, "not validated"),
              })
          json.dump({"baseSeed": int(base), "clips": clips}, open(out, "w"), indent=2, sort_keys=True)
          print(f"manifest: {len(clips)} clips -> {out}")
          PY
          cp clips/manifest.json validation/manifest.json
          cp raw/*.director.log validation/ 2>/dev/null || true
          # Failed clips move to rejected/ (their own artifact, for diagnosis),
          # so `scenario-clips` holds only clips that passed. The manifest
          # lists every clip with its result.
          mkdir -p rejected
          while IFS=$'\t' read -r cid res <&3; do
            if [ "${res%%:*}" != "PASS" ] && [ -f "clips/$cid.mp4" ]; then mv "clips/$cid.mp4" rejected/; fi
          done 3< "$results"
          cp clips/manifest.json rejected/manifest.json
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          ls -lh clips rejected || true
          exit "$failed"

      - name: Upload validation summary
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: clip-validation
          path: validation/
          retention-days: 3
          if-no-files-found: warn

      # Clips that failed validation go to a separate artifact for diagnosis,
      # so nothing downstream imports them as good clips.
      - name: Upload rejected clips
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-clips
          path: |
            rejected/*.mp4
            rejected/manifest.json
          retention-days: 3
          if-no-files-found: ignore

      # The clips that passed, plus the manifest. Asar Studio downloads this
      # artifact by name. Uploaded even when some other clip failed.
      - name: Upload clips
        if: always() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: scenario-clips
          path: |
            clips/*.mp4
            clips/manifest.json
          retention-days: 3
          if-no-files-found: error
